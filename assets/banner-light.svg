<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Christian Rodriguez</title>
  <desc id="desc">Computer Science at CSU Bakersfield. Backend web development and databases.</desc>
  <!-- Profile banner: soft pools of ink drifting behind my name, the same look as the homepage
       of my portfolio. Light theme. The pools sit near the corners so the text stays clear;
       they hold still when the viewer asks for reduced motion. -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="28"/>
    </clipPath>
  </defs>
  <style>
    .pool { transform-box: fill-box; transform-origin: center; animation: drift 19s ease-in-out infinite alternate; }
    .pool.two { animation-duration: 23s; animation-delay: -7s; }
    .pool.three { animation-duration: 27s; animation-delay: -12s; }
    .pool.four { animation-duration: 21s; animation-delay: -4s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(36px, -18px) scale(1.18); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pool { animation: none; }
    }
    .name { font: 700 68px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; letter-spacing: -2.4px; fill: #1d1d1f; }
    .line { font: 500 24px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; letter-spacing: -0.3px; fill: #515156; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#f5f5f7"/>
    <rect width="1199" height="299" x="0.5" y="0.5" rx="27.5" fill="none" stroke="#e5e5ea"/>
    <g filter="url(#soft)" opacity="0.5">
      <circle class="pool" cx="110" cy="250" r="120" fill="#ff40a0"/>
      <circle class="pool two" cx="1100" cy="60" r="125" fill="#00c8aa"/>
      <circle class="pool three" cx="230" cy="20" r="95" fill="#5078ff"/>
      <circle class="pool four" cx="1040" cy="270" r="110" fill="#ffaa28"/>
    </g>
  </g>
  <text class="name" x="600" y="148" text-anchor="middle">Christian Rodriguez</text>
  <text class="line" x="600" y="200" text-anchor="middle">Computer Science at CSU Bakersfield · Backend web development and databases</text>
</svg>
